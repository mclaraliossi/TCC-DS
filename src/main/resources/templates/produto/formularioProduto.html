<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bodyFormCad">
    <h1 class="textPrincipal">Cadastro de Produtos</h1>
    <form class="formCad" th:action="@{/produtos/salvar}" method="post" th:object="${produto}">

        <h2 class="tituloForm">Formulário de Produto</h2>
        <input class="inputCad" type="hidden" th:field="*{idProduto}">

        <label class="labelCad" for="nomeProduto">Nome:</label>
        <input class="inputCad" type="text" id="nomeProduto" th:field="*{nomeProduto}" required maxlength="50"><br><br>

        <label class="labelCad" for="marcaProduto">Marca:</label>
        <input class="inputCad" type="text" id="marcaProduto" th:field="*{marcaProduto}" required maxlength="50"><br><br>

        <label class="labelCad" for="descricaoProduto">Descrição:</label>
        <input class="inputCad" type="text" id="descricaoProduto" th:field="*{descricaoProduto}" required maxlength="100"><br><br>

        <label class="labelCad" for="precoProduto">Preço:</label>
        <input class="inputCad" type="number" id="precoProduto" th:field="*{precoProduto}" step="0.01" min="0"><br><br>

        <label class="labelCad" for="validadeProduto">Data de validade:</label>
        <input class="inputCad" type="date" id="validadeProduto" th:field="*{validadeProduto}"><br><br>

        <label class="labelCad" for="datafabricacaoProduto">Data de fabricação:</label>
        <input class="inputCad" type="date" id="datafabricacaoProduto" th:field="*{datafabricacaoProduto}"><br><br>

        <label class="labelCad" for="loteProduto">Lote:</label>
        <input class="inputCad" type="text" id="loteProduto" th:field="*{loteProduto}" required maxlength="50"><br><br>

        <label class="labelCad" for="paisorigemProduto">País de origem:</label>
        <input class="inputCad" type="text" id="paisorigemProduto" th:field="*{paisorigemProduto}" required maxlength="30"><br><br>

        <label class="labelCad" for="empresaProduto">Empresa:</label>
        <input class="inputCad" type="text" id="empresaProduto" th:field="*{empresaProduto}" required maxlength="30"><br><br>

        <label class="labelCad" for="porcaoProduto">Porção (g ou ml):</label>
        <input class="inputCad" type="number" id="porcaoProduto" th:field="*{porcaoProduto}" step="0.01" min="0"><br><br>

        <label class="labelCad" for="valorenergeticoProduto">Valor energético:</label>
        <input class="inputCad" type="text" id="valorenergeticoProduto" th:field="*{valorenergeticoProduto}"><br><br>

        <label class="labelCad" for="carboidratosProduto">Carboidratos:</label>
        <input class="inputCad" type="text" id="carboidratosProduto" th:field="*{carboidratosProduto}"><br><br>

        <label class="labelCad" for="proteinasProduto">Proteínas:</label>
        <input class="inputCad" type="text" id="proteinasProduto" th:field="*{proteinasProduto}"><br><br>

        <label class="labelCad" for="gordurastotaisProduto">Gorduras totais:</label>
        <input class="inputCad" type="text" id="gordurastotaisProduto" th:field="*{gordurastotaisProduto}"><br><br>

        <label class="labelCad" for="gordurassaturadasProduto">Gorduras saturadas:</label>
        <input class="inputCad" type="text" id="gordurassaturadasProduto" th:field="*{gordurassaturadasProduto}"><br><br>

        <label class="labelCad" for="fibrasProduto">Fibras:</label>
        <input class="inputCad" type="text" id="fibrasProduto" th:field="*{fibrasProduto}"><br><br>

        <label class="labelCad" for="sodioProduto">Sódio:</label>
        <input class="inputCad" type="text" id="sodioProduto" th:field="*{sodioProduto}"><br><br>

        <label class="labelCad" for="ingredientesProduto">Ingredientes:</label>
        <input class="inputCad" type="text" id="ingredientesProduto" th:field="*{ingredientesProduto}" required maxlength="100"><br><br>

        <label class="labelCad" for="alergicosProduto">Alérgicos:</label>
        <input class="inputCad" type="text" id="alergicosProduto" th:field="*{alergicosProduto}" required maxlength="100"><br><br>


        <button class="btnSalvar" type="submit">Salvar</button>

    </form>
    <br><br>

    <button class="btnVoltar" ><a class="linkVoltar" href="/home">Voltar</a></button>
    
</body>
</html>

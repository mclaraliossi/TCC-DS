<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AccessOne</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header class="cabecalho">

    <nav class="nav">

        <a class="logo" th:href="@{/}">
            AccessOne
        </a>

        <a th:href="@{/}">
            Voltar ao início
        </a>

    </nav>

</header>

<main class="container pequeno">

    <div class="card">

        <h1>Entrar no AccessOne</h1>

        <p class="subtitulo">
            Acesso para empresas cadastradas e administrador.
        </p>

        <p class="aviso-erro"
           role="alert"
           th:if="${param.error}">
            E-mail ou senha inválidos.
        </p>

        <p class="aviso-ok"
           role="status"
           th:if="${param.cadastro}">
            Empresa cadastrada com sucesso!
        </p>

        <p class="aviso-ok"
           role="status"
           th:if="${param.logout}">
            Você saiu da sua conta.
        </p>

        <form th:action="@{/login}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="campo">

                <label for="username">
                    E-mail
                </label>

                <input type="email"
                       id="username"
                       name="username"
                       placeholder="seuemail@empresa.com"
                       autocomplete="username"
                       required>

            </div>

            <div class="campo">

                <label for="password">
                    Senha
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>

            </div>

            <button class="botao" type="submit">
                Entrar
            </button>

        </form>

        <p style="margin-top: 20px;">
            Ainda não tem conta?

            <a th:href="@{/cadastro/empresa}">
                Cadastre sua empresa
            </a>
        </p>

    </div>

</main>

</body>
</html>

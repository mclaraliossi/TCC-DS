<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Empresa - AccessOne</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header class="cabecalho">

    <nav class="nav">

        <a class="logo" th:href="@{/}">
            AccessOne
        </a>

        <a th:href="@{/login}">
            Já tenho conta
        </a>

    </nav>

</header>

<main class="container pequeno">

    <div class="card">

        <h1>Cadastrar empresa</h1>

        <p class="subtitulo">
            Crie a conta do responsável e cadastre
            os dados do estabelecimento.
        </p>

        <!-- Mensagens retornadas pela controller -->
        <p class="aviso-erro"
           role="alert"
           th:if="${erroCadastro}"
           th:text="${erroCadastro}">
        </p>

        <form th:action="@{/cadastro/empresa}"
              th:object="${cadastroEmpresa}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- DADOS DO USUÁRIO -->

            <fieldset class="secao-form">

                <legend>Dados do responsável</legend>

                <div class="campo">

                    <label for="nome">
                        Nome completo *
                    </label>

                    <input type="text"
                           id="nome"
                           th:field="*{nome}"
                           maxlength="150"
                           autocomplete="name"
                           required>

                    <span class="erro"
                          th:if="${#fields.hasErrors('nome')}"
                          th:errors="*{nome}">
                    </span>

                </div>

                <div class="campo">

                    <label for="email">
                        E-mail *
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           autocomplete="email"
                           required>

                    <span class="erro"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}">
                    </span>

                </div>

                <div class="form-grid">

                    <div class="campo">

                        <label for="senha">
                            Senha *
                        </label>

                        <input type="password"
                               id="senha"
                               name="senha"
                               minlength="8"
                               maxlength="72"
                               autocomplete="new-password"
                               required>

                        <span class="erro"
                              th:if="${#fields.hasErrors('senha')}"
                              th:errors="*{senha}">
                        </span>

                    </div>

                    <div class="campo">

                        <label for="confirmarSenha">
                            Confirmar senha *
                        </label>

                        <input type="password"
                               id="confirmarSenha"
                               name="confirmarSenha"
                               minlength="8"
                               autocomplete="new-password"
                               required>

                        <span class="erro"
                              th:if="${#fields.hasErrors('confirmarSenha')}"
                              th:errors="*{confirmarSenha}">
                        </span>

                    </div>

                </div>

            </fieldset>

            <!-- DADOS DA EMPRESA -->

            <fieldset class="secao-form">

                <legend>Dados da empresa</legend>

                <div class="campo">

                    <label for="razaoSocial">
                        Razão social *
                    </label>

                    <input type="text"
                           id="razaoSocial"
                           th:field="*{razaoSocial}"
                           maxlength="200"
                           required>

                    <span class="erro"
                          th:if="${#fields.hasErrors('razaoSocial')}"
                          th:errors="*{razaoSocial}">
                    </span>

                </div>

                <div class="form-grid">

                    <div class="campo">

                        <label for="cnpj">
                            CNPJ *
                        </label>

                        <input type="text"
                               id="cnpj"
                               th:field="*{cnpj}"
                               maxlength="18"
                               placeholder="00.000.000/0000-00"
                               required>

                        <span class="erro"
                              th:if="${#fields.hasErrors('cnpj')}"
                              th:errors="*{cnpj}">
                        </span>

                    </div>

                    <div class="campo">

                        <label for="inscricaoEstadual">
                            Inscrição estadual (se houver)
                        </label>

                        <input type="text"
                               id="inscricaoEstadual"
                               th:field="*{inscricaoEstadual}">

                    </div>

                </div>

                <div class="campo">

                    <label for="endereco">
                        Endereço completo *
                    </label>

                    <input type="text"
                           id="endereco"
                           th:field="*{endereco}"
                           placeholder="Rua, número, bairro, cidade e estado"
                           required>

                    <span class="erro"
                          th:if="${#fields.hasErrors('endereco')}"
                          th:errors="*{endereco}">
                    </span>

                </div>

            </fieldset>

            <p class="ajuda">
                * Campos obrigatórios.
                A conta criada será do tipo EMPRESA.
            </p>

            <button class="botao" type="submit">
                Cadastrar empresa
            </button>

        </form>

        <p style="margin-top: 20px;">
            Já possui uma conta?
            <a th:href="@{/login}">Fazer login</a>
        </p>

    </div>

</main>

</body>
</html>

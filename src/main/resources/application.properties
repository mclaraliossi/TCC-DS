spring.application.name=accessone

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accessone_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postdba}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Servidor
server.port=8080